<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Config.cpp Editor - DayZ Tools</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="tools.css">
    <link rel="stylesheet" href="config-editor.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- 背景轮播 -->
    <div class="background-slideshow">
        <div class="bg-slide active"></div>
        <div class="bg-slide"></div>
        <div class="bg-slide"></div>
    </div>

    <!-- 顶部导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <h2>Config.cpp Editor</h2>
            </div>
            <div class="nav-menu">
                <a href="../index.html" class="nav-link">
                    <i class="fas fa-home"></i> Home
                </a>
                <a href="index.html" class="nav-link">
                    <i class="fas fa-tools"></i> DayZ Tools
                </a>
                <a href="#" class="nav-link active">
                    <i class="fas fa-code"></i> Config Editor
                </a>
                <button id="theme-toggle" class="nav-link theme-toggle" title="Toggle Dark Mode">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <!-- 主要内容区域 -->
    <main class="main-content">
        <div class="container">
            <!-- 返回按钮 -->
            <div class="editor-nav">
                <a href="index.html" class="back-link">
                    <i class="fas fa-arrow-left"></i> Back to Tools
                </a>
            </div>

            <!-- 编辑器容器 -->
            <div class="config-editor-container">
                <!-- 输入区域 -->
                <div class="config-input-section">
                    <div class="section-header">
                        <h3><i class="fas fa-upload"></i> Input config.cpp Content</h3>
                    </div>
                    <textarea id="config-input" placeholder="Paste your config.cpp file content here...&#10;&#10;Example:&#10;class cfgVehicles&#10;{&#10;    class MyItem : ItemBase&#10;    {&#10;        displayName = &quot;My Item&quot;;&#10;        weight = 1.0;&#10;        // ... more parameters&#10;    };&#10;};"></textarea>
                    <div class="input-actions">
                        <button id="parse-config-btn" class="btn btn-primary">
                            <i class="fas fa-cogs"></i> Parse Config
                        </button>
                        <button id="clear-input-btn" class="btn btn-secondary">
                            <i class="fas fa-trash"></i> Clear
                        </button>
                    </div>
                </div>
                
                <!-- 输出区域 -->
                <div class="config-output-section" id="config-output-section" style="display: none;">
                    <div class="section-header">
                        <h3><i class="fas fa-list"></i> Parse Results</h3>
                        <div class="output-actions">
                            <button id="expand-all-btn" class="btn btn-secondary">
                                <i class="fas fa-expand-arrows-alt"></i> Expand All
                            </button>
                            <button id="collapse-all-btn" class="btn btn-secondary">
                                <i class="fas fa-compress-arrows-alt"></i> Collapse All
                            </button>
                            <button id="export-config-btn" class="btn btn-success">
                                <i class="fas fa-download"></i> Export Config
                            </button>
                        </div>
                    </div>
                    <div id="parsed-classes"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Back to top button -->
    <button id="back-to-top" class="back-to-top" title="Back to top">
        <i class="fas fa-chevron-up"></i>
    </button>

    <script src="config-editor.js"></script>
</body>
</html>
