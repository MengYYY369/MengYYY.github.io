name: Build Blog

on:
  # 当有新的Issues或Issues更新时触发
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  
  # 手动触发
  workflow_dispatch:
  
  # 定时触发（每天凌晨2点）
  # schedule:
  #   - cron: '0 2 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      issues: read
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Fetch Issues and Generate Data
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # 创建数据目录
        mkdir -p data
        
        # 获取Issues数据
        curl -H "Authorization: token $GITHUB_TOKEN" \
             -H "Accept: application/vnd.github.v3+json" \
             "https://api.github.com/repos/${{ github.repository }}/issues?state=open&sort=created&direction=desc&per_page=100" \
             > data/issues.json
        
        # 检查文件是否创建成功
        if [ -f data/issues.json ]; then
          echo "Issues data fetched successfully"
          echo "Number of issues: $(jq length data/issues.json)"
        else
          echo "Failed to fetch issues data"
          exit 1
        fi
        
    - name: Generate Blog Data
      run: |
        # 创建Node.js脚本来处理数据
        cat > generate-blog-data.js << 'EOF'
        const fs = require('fs');
        
        // 读取Issues数据
        const issues = JSON.parse(fs.readFileSync('data/issues.json', 'utf8'));
        
        // 过滤和处理文章数据
        const articles = issues
          .filter(issue => {
            // 过滤有标签的Issues作为文章
            return issue.labels && issue.labels.length > 0;
          })
          .map(issue => {
            // 提取第一张图片作为封面
            const extractFirstImage = (content) => {
              if (!content) return null;
              
              // GitHub用户上传的图片
              const githubImgRegex = /!\[.*?\]\((https:\/\/github\.com\/user-attachments\/assets\/[^)]+)\)/;
              const githubMatch = content.match(githubImgRegex);
              if (githubMatch && githubMatch[1]) return githubMatch[1];
              
              // 普通Markdown图片
              const imgRegex = /!\[.*?\]\((https?:\/\/[^)]+)\)/;
              const match = content.match(imgRegex);
              if (match && match[1]) return match[1];
              
              // HTML img标签
              const htmlImgRegex = /<img[^>]+src="([^">]+)"/;
              const htmlMatch = content.match(htmlImgRegex);
              if (htmlMatch && htmlMatch[1]) return htmlMatch[1];
              
              return null;
            };
            
            // 生成摘要
            const generateExcerpt = (content, maxLength = 150) => {
              if (!content) return '暂无内容预览...';
              
              let text = content
                .replace(/!\[.*?\]\(.*?\)/g, '')
                .replace(/\[.*?\]\(.*?\)/g, '')
                .replace(/#{1,6}\s/g, '')
                .replace(/\*\*(.*?)\*\*/g, '$1')
                .replace(/\*(.*?)\*/g, '$1')
                .replace(/`(.*?)`/g, '$1')
                .replace(/<[^>]*>/g, '')
                .replace(/\n+/g, ' ')
                .trim();
              
              if (text.length > maxLength) {
                text = text.substring(0, maxLength) + '...';
              }
              
              return text || '暂无内容预览...';
            };
            
            return {
              id: issue.number,
              title: issue.title,
              body: issue.body,
              excerpt: generateExcerpt(issue.body),
              coverImage: extractFirstImage(issue.body),
              labels: issue.labels.map(label => ({
                name: label.name,
                color: label.color
              })),
              created_at: issue.created_at,
              updated_at: issue.updated_at,
              html_url: issue.html_url,
              user: {
                login: issue.user.login,
                avatar_url: issue.user.avatar_url
              }
            };
          });
        
        // 生成博客数据文件
        const blogData = {
          articles: articles,
          lastUpdated: new Date().toISOString(),
          totalCount: articles.length
        };
        
        // 写入数据文件
        fs.writeFileSync('data/blog-data.json', JSON.stringify(blogData, null, 2));
        
        console.log(`Generated blog data with ${articles.length} articles`);
        EOF
        
        # 运行脚本
        node generate-blog-data.js
        
    - name: Commit and Push Changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # 添加数据文件
        git add data/
        
        # 检查是否有变化
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Update blog data - $(date)"
          git push
        fi
    
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      if: github.ref == 'refs/heads/main'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./
        exclude_assets: '.github,node_modules,*.md'