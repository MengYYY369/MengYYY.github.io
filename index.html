<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My MODs</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- 背景轮播 -->
    <div class="background-slideshow">
        <div class="bg-slide active"></div>
        <div class="bg-slide"></div>
        <div class="bg-slide"></div>
    </div>
    <!-- 顶部导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <h2>My MODs</h2>
            </div>
            <div class="nav-menu">
                <a href="#" class="nav-link active">
                    <i class="fas fa-home"></i> Home
                </a>
                <a href="Tools/index.html" class="nav-link">
                    <i class="fas fa-tools"></i> DayZ Tools
                </a>
                <a href="https://discord.gg/BqgkQ3wxZr" class="nav-link" target="_blank">
                    <i class="fab fa-discord"></i> Discord
                </a>
                <a href="https://www.youtube.com/@My-666-abc" class="nav-link" target="_blank">
                    <i class="fab fa-youtube"></i> YouTube
                </a>
                <a href="https://github.com/MengYYY369" class="nav-link" target="_blank">
                    <i class="fab fa-github"></i> GitHub
                </a>
                <button id="theme-toggle" class="nav-link theme-toggle" title="Toggle Dark Mode">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <!-- 主要内容区域 -->
    <main class="main-content">
        <div class="container">
            <!-- Loading indicator -->
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>Loading articles...</p>
            </div>
            
            <!-- Articles grid -->
            <div id="articles-grid" class="articles-grid">
                <!-- Articles will be loaded dynamically via JavaScript -->
            </div>
            
            <!-- No articles message -->
            <div id="no-articles" class="no-articles" style="display: none;">
                <i class="fas fa-file-alt"></i>
                <p>No articles available</p>
            </div>
        </div>
    </main>

    <!-- 图片灯箱 -->
    <div id="lightbox" class="lightbox">
        <div class="lightbox-content">
            <span class="lightbox-close">&times;</span>
            <button class="lightbox-nav lightbox-prev" id="lightbox-prev">
                <i class="fas fa-chevron-left"></i>
            </button>
            <button class="lightbox-nav lightbox-next" id="lightbox-next">
                <i class="fas fa-chevron-right"></i>
            </button>
            <img id="lightbox-img" src="" alt="">
            <div class="lightbox-caption"></div>
        </div>
    </div>

    <!-- Back to top button -->
    <button id="back-to-top" class="back-to-top" title="Back to top">
        <i class="fas fa-chevron-up"></i>
    </button>

    <script src="script.js"></script>
</body>
</html>
