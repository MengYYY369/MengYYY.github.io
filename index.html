<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人博客</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- 背景轮播 -->
    <div class="background-slideshow">
        <div class="bg-slide active"></div>
        <div class="bg-slide"></div>
        <div class="bg-slide"></div>
    </div>
    <!-- 顶部导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <h2>我的博客</h2>
            </div>
            <div class="nav-menu">
                <a href="#" class="nav-link active">首页</a>
                <a href="#" class="nav-link">
                    <i class="fas fa-tools"></i> DayZ Tools
                </a>
                <a href="https://discord.gg/your-discord" class="nav-link" target="_blank">
                    <i class="fab fa-discord"></i> Discord
                </a>
                <a href="https://youtube.com/@your-channel" class="nav-link" target="_blank">
                    <i class="fab fa-youtube"></i> YouTube
                </a>
                <a href="https://github.com/your-username" class="nav-link" target="_blank">
                    <i class="fab fa-github"></i> GitHub
                </a>
            </div>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <!-- 主要内容区域 -->
    <main class="main-content">
        <div class="container">
            <!-- 加载提示 -->
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>正在加载文章...</p>
            </div>
            
            <!-- 文章网格 -->
            <div id="articles-grid" class="articles-grid">
                <!-- 文章将通过JavaScript动态加载 -->
            </div>
            
            <!-- 无文章提示 -->
            <div id="no-articles" class="no-articles" style="display: none;">
                <i class="fas fa-file-alt"></i>
                <p>暂无文章</p>
            </div>
        </div>
    </main>

    <!-- 图片灯箱 -->
    <div id="lightbox" class="lightbox">
        <div class="lightbox-content">
            <span class="lightbox-close">&times;</span>
            <img id="lightbox-img" src="" alt="">
            <div class="lightbox-caption"></div>
        </div>
    </div>

    <!-- 回到顶部按钮 -->
    <button id="back-to-top" class="back-to-top" title="回到顶部">
        <i class="fas fa-chevron-up"></i>
    </button>

    <script src="script.js"></script>
</body>
</html>
