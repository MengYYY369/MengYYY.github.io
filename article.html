<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article Details - My MODs</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- 背景轮播 -->
    <div class="background-slideshow">
        <div class="bg-slide active"></div>
        <div class="bg-slide"></div>
        <div class="bg-slide"></div>
    </div>

    <!-- 顶部导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <h2>My MODs</h2>
            </div>
            <div class="nav-menu">
                <a href="index.html" class="nav-link">
                    <i class="fas fa-home"></i> Home
                </a>
                <a href="#" class="nav-link">
                    <i class="fas fa-tools"></i> DayZ Tools
                </a>
                <a href="https://discord.gg/BqgkQ3wxZr" class="nav-link" target="_blank">
                    <i class="fab fa-discord"></i> Discord
                </a>
                <a href="https://www.youtube.com/@My-666-abc" class="nav-link" target="_blank">
                    <i class="fab fa-youtube"></i> YouTube
                </a>
                <a href="https://github.com/MengYYY369" class="nav-link" target="_blank">
                    <i class="fab fa-github"></i> GitHub
                </a>
                <button id="theme-toggle" class="nav-link theme-toggle" title="Toggle Dark Mode">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <!-- 文章内容 -->
    <main class="main-content">
        <div class="container">
            <!-- 导航按钮 -->
            <div class="article-nav">
                <a href="index.html" class="back-link">
                    <i class="fas fa-arrow-left"></i> Back to Home
                </a>
                <a href="#" id="next-article" class="next-link" style="display: none;">
                    Next Article <i class="fas fa-arrow-right"></i>
                </a>
            </div>

            <!-- 文章容器 -->
            <article class="article-container">
                <div id="loading" class="loading">
                    <div class="spinner"></div>
                    <p>Loading article...</p>
                </div>
                
                <div id="article-content" class="article-full-content" style="display: none;">
                    <!-- 文章内容将通过JavaScript加载 -->
                </div>

                <div id="article-error" class="article-error" style="display: none;">
                    <i class="fas fa-exclamation-triangle"></i>
                    <h3>Failed to Load Article</h3>
                    <p>Please check your network connection or try again later</p>
                    <a href="index.html" class="error-back-btn">Back to Home</a>
                </div>
            </article>
        </div>
    </main>

    <!-- 图片灯箱 -->
    <div id="lightbox" class="lightbox">
        <div class="lightbox-content">
            <span class="lightbox-close">&times;</span>
            <button class="lightbox-nav lightbox-prev" id="lightbox-prev">
                <i class="fas fa-chevron-left"></i>
            </button>
            <button class="lightbox-nav lightbox-next" id="lightbox-next">
                <i class="fas fa-chevron-right"></i>
            </button>
            <img id="lightbox-img" src="" alt="">
            <div class="lightbox-caption"></div>
        </div>
    </div>

    <!-- Back to top button -->
    <button id="back-to-top" class="back-to-top" title="Back to top">
        <i class="fas fa-chevron-up"></i>
    </button>

    <script src="article.js"></script>
</body>
</html>
